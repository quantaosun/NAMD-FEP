# Byte-compatibility case: reproduce the 6I5I build that produced the PUBLISHED
# ddG, exactly as it was, including its type-namespace bug.
#
# This config exists only for verification. It is NOT what you should run a new
# system from -- for that use systems/6i5i/system.ini, whose type_prefix = L
# keeps the ligand's GAFF types out of CHARMM36's case-insensitive namespace.
# The difference between the two is the point of the 6i5i verification: the
# legacy build emits 7 "DUPLICATE ... ENTRY" warnings per process and silently
# overrides the protein's aromatic parameters; the corrected one emits none.
#
# `params` below is written with the relative paths 6I5I's frozen .namd files
# actually contain, and is emitted verbatim -- so those lines reproduce exactly.
# A {root}-derived path would be emitted absolute, which is right for running
# but would not reproduce a legacy file.

[system]
name        = 6i5i-legacy
description = 6I5I as published: N-CH3 -> N-H, raw (colliding) ligand atom types

[ligand]
dir     = ../../6I5I_DUAL_FEP/inputs
ref     = ref
mut     = mut
resname = UNL

[protein]
pdb            = ../../6I5I_DUAL_FEP/inputs/protein.pdb
chain          = A
segment_prefix = P
first          = NTER
last           = CTER

[mutation]
strategy      = atom_addition
vanish        = C12 H7 H8 H9
# `appear` names atoms in the MUTANT (as for element_swap). For
# atom_addition the hybrid gives the new atom a fresh name -- the next
# free H<n>, which here is H17. Override with [mutation] new_atom_name.
appear        = H
placement     = local_frame
missing_terms = mirror_then_synth

[hybrid]
title       = Dual-topology hybrid ligand (6I5I: N-CH3 -> N-H)
type_prefix = raw
rtf_order   = source_then_new
prm_order   = source_then_new

[topology]
prot_rtf = {root}/../../toppar/top_all36_prot.rtf
params   = ../../toppar/par_all36m_prot.prm
           ../../toppar/par_all36_na.prm
           ../../toppar/par_all36_carb.prm
           ../../toppar/par_all36_lipid.prm
           ../../toppar/par_all36_cgenff.prm
           ../../toppar/par_water_ions_clean.prm
           ../hybrid/hybrid.prm

[run]
legs              = complex solvent
lambdas           = 0.0 0.045 0.09 0.14546 0.22425 0.30303 0.38182 0.46061
                    0.5394 0.61819 0.697 0.77576 0.85455 0.91 0.955 1.0
steps_per_window  = 250000
equil_steps       = 50000
alch_equil_steps  = 50000
outfreq           = 500
min_steps         = 5000
timestep          = 2.0
temperature       = 300.0
cutoff            = 12.0
switchdist        = 10.0
pairlistdist      = 14.0
elec_lambda_start = 0.5
vdw_lambda_end    = 1.0
vdw_shift_coeff   = 5.0
decouple          = off

[binaries]
namd = ${NAMD:-/home/aistudio/NAMD_3.0.3_Source/Linux-x86_64-g++.gpuresident/namd3}
vmd  = ${VMD:-/home/aistudio/vmd-env/bin/vmd}
