# Local-conda copy of the NAMD-FEP notebook environment.
#
# The environment.yml at the repository root is the one mybinder.org
# (repo2docker) reads. This copy exists for building a local conda env by
# hand:
#
#     conda env create -f notebooks/environment.yml
#
# Keep the two in sync.
name: namd-fep
channels:
  - conda-forge
dependencies:
  - python>=3.10
  - numpy
  - matplotlib
  - rdkit
  - openbabel          # the obabel CLI that `rbfe-prep ligand` shells out to
  - jupyterlab
  - ipywidgets
  - pip
  - pip:
      - nglview==3.1.4  # interactive 3D viewer. Pin: 3.1.4 is the last release whose
                        # backend (`_model_module_version`) and prebuilt labextension
                        # versions match exactly (both 3.1.4). 4.0/4.0.1 declare "4.0"
                        # but ship a "3.1.5" bundle, so every 3D view fails on
                        # JupyterLab with "version 4.0 is not registered".
      - "setuptools<81" # nglview 3.1.4 does `import pkg_resources`, removed from
                        # setuptools >= 81 (Python >= 3.12 images)
      - acpype         # ligand parameterisation (AM1-BCC), pip-only
