# Local-conda copy of the NAMD-FEP notebook environment.
#
# binder/environment.yml is the file mybinder.org (repo2docker) actually
# reads -- it only discovers config in the repo root, binder/, or .binder/.
# This copy exists for building a local conda env by hand:
#
#     conda env create -f notebooks/environment.yml
#
# Keep the two in sync.
name: namd-fep
channels:
  - conda-forge
dependencies:
  - python>=3.10
  - numpy
  - matplotlib
  - rdkit
  - openbabel          # the obabel CLI that `rbfe-prep ligand` shells out to
  - jupyterlab
  - ipywidgets
  - pip
  - pip:
      - nglview        # interactive 3D viewer (not on conda-forge for all py)
      - acpype         # ligand parameterisation (AM1-BCC), pip-only
