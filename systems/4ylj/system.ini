# 4YLJ DYRK1A -- ligand 4E1, 10-iodo -> 10-bromo
#
# An element swap: nothing is added or removed, both ligands carry the same
# atoms under the same names, and the mutant .pdb already holds the bromine at
# the right place.  See rbfe/mutations/element_swap.py for why that makes this
# the simpler of the two strategies.
#
# Ligand and protein inputs are read from the frozen 4YLJ/ tree (read-only);
# every generated artefact lands under --out, or here if --out is not given.

[system]
name        = 4ylj
description = DYRK1A (PDB 4YLJ), ligand 4E1: I1 -> Br1 at the same ring position

[ligand]
dir     = ../../4YLJ/inputs
ref     = ref
mut     = mut
resname = UNL

[protein]
pdb            = ../../4YLJ/inputs/protein.pdb
chain          = A
segment_prefix = P
first          = NTER
last           = CTER

[mutation]
strategy      = element_swap
vanish        = I1
appear        = Br1
placement     = native
missing_terms = synth_from_geometry

[hybrid]
title       = 4YLJ DYRK1A I -> Br
# The L prefix keeps the ligand's GAFF types (ca, cc, cd, ha, os ...) out of the
# CHARMM36 protein's case-insensitive namespace.  Without it NAMD reports seven
# "DUPLICATE ... ENTRY" warnings and the ligand silently overrides the protein's
# aromatic parameters -- see README "Traps".
type_prefix = L
rtf_order   = sorted
prm_order   = source_then_new

[build]
padding    = 15.0
neutralize = yes
salt       = 0.0
pdbalias   = atom ILE CD1 CD
             atom SER HG HG1
             residue HIS HSD

[topology]
prot_rtf = {root}/../../toppar/top_all36_prot.rtf
params   = {root}/../../toppar/par_all36m_prot.prm
           {root}/../../toppar/par_all36_na.prm
           {root}/../../toppar/par_all36_carb.prm
           {root}/../../toppar/par_all36_lipid.prm
           {root}/../../toppar/par_all36_cgenff.prm
           {root}/../../toppar/par_water_ions_clean.prm
           {hybrid}

[run]
legs              = complex solvent
lambdas           = 0.0 0.045 0.09 0.14546 0.22425 0.30303 0.38182 0.46061
                    0.5394 0.61819 0.697 0.77576 0.85455 0.91 0.955 1.0
steps_per_window  = 500000
equil_steps       = 50000
alch_equil_steps  = 50000
outfreq           = 500
min_steps         = 5000
timestep          = 2.0
temperature       = 300.0
cutoff            = 12.0
switchdist        = 10.0
pairlistdist      = 14.0
elec_lambda_start = 0.5
vdw_lambda_end    = 1.0
vdw_shift_coeff   = 5.0
decouple          = off
max_hours         = 40.0

[binaries]
namd         = ${NAMD:-/home/aistudio/NAMD_3.0.3_Source/Linux-x86_64-g++.gpuresident/namd3}
vmd          = ${VMD:-/home/aistudio/vmd-env/bin/vmd}
flags        = +p1 +devices 0
gpu_resident = on
