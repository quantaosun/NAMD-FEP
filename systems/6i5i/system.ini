# 6I5I CLK1 -- ligand H3E "12H", pyrazole N-CH3 -> N-H (desmethylation)
#
# An atom addition: the mutant has an N-H that the reference does not, so this
# strategy identifies the methyl, identifies the N-H, and *places* the new
# hydrogen by a rigid alignment in the local nitrogen frame.  See
# rbfe/mutations/addition.py.
#
# Ligand and protein inputs are read from the frozen 6I5I_DUAL_FEP/ tree
# (read-only); generated artefacts land under --out, or here if --out is not
# given.

[system]
name        = 6i5i
description = CLK1 (PDB 6I5I), ligand H3E "12H": N-CH3 -> N-H (desmethylation)

[ligand]
dir     = ../../6I5I_DUAL_FEP/inputs
ref     = ref
mut     = mut
resname = UNL

[protein]
pdb            = ../../6I5I_DUAL_FEP/inputs/protein.pdb
chain          = A
segment_prefix = P
first          = NTER
last           = CTER

[mutation]
strategy      = atom_addition
vanish        = C12 H7 H8 H9
# `appear` names atoms in the MUTANT (as for element_swap). For
# atom_addition the hybrid gives the new atom a fresh name -- the next
# free H<n>, which here is H17. Override with [mutation] new_atom_name.
appear        = H
placement     = local_frame
missing_terms = mirror_then_synth

[hybrid]
title       = 6I5I CLK1 N-CH3 -> N-H
# NOTE: this is the CORRECTED build, not the one that produced the published
# ddG.  The 6I5I hybrid.rmt/prm shipped in 6I5I_DUAL_FEP/ emit raw GAFF types
# (ca, cc, cd, ha, os) which collide case-insensitively with CHARMM36's protein
# types; NAMD takes the last duplicate, so hybrid.prm -- listed last -- silently
# overrode the protein's aromatic parameters in all seven places listed in the
# README.  The L prefix keeps the ligand in its own namespace.  To reproduce the
# published bytes instead, use verify/cases/6i5i-legacy.ini (type_prefix = raw).
type_prefix = L
rtf_order   = source_then_new
prm_order   = source_then_new

[build]
padding    = 15.0
neutralize = yes
salt       = 0.0
pdbalias   = atom ILE CD1 CD
             atom SER HG HG1
             residue HIS HSD

[topology]
prot_rtf = {root}/../../toppar/top_all36_prot.rtf
params   = {root}/../../toppar/par_all36m_prot.prm
           {root}/../../toppar/par_all36_na.prm
           {root}/../../toppar/par_all36_carb.prm
           {root}/../../toppar/par_all36_lipid.prm
           {root}/../../toppar/par_all36_cgenff.prm
           {root}/../../toppar/par_water_ions_clean.prm
           {hybrid}

[run]
legs              = complex solvent
lambdas           = 0.0 0.045 0.09 0.14546 0.22425 0.30303 0.38182 0.46061
                    0.5394 0.61819 0.697 0.77576 0.85455 0.91 0.955 1.0
steps_per_window  = 250000
equil_steps       = 50000
alch_equil_steps  = 50000
outfreq           = 500
min_steps         = 5000
timestep          = 2.0
temperature       = 300.0
cutoff            = 12.0
switchdist        = 10.0
pairlistdist      = 14.0
elec_lambda_start = 0.5
vdw_lambda_end    = 1.0
vdw_shift_coeff   = 5.0
decouple          = off
max_hours         = 24.0

[binaries]
namd         = ${NAMD:-/home/aistudio/NAMD_3.0.3_Source/Linux-x86_64-g++.gpuresident/namd3}
vmd          = ${VMD:-/home/aistudio/vmd-env/bin/vmd}
flags        = +p1 +devices 0
gpu_resident = on
