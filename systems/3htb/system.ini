# 3HTB T4 lysozyme L99A/M102Q -- 2-ethylphenol -> 2-propylphenol
#
# A system built from scratch to exercise the workflow end to end on a PDB it
# has never seen. The reference is derived from the crystal ligand JZ4
# (2-propylphenol) by deleting the terminal propyl carbon, so both ligands keep
# the crystallographic pose of the shared heavy atoms.
#
# NOT element_swap, deliberately. acpype numbers atoms sequentially in input
# order, and the reference was produced by deleting the FIRST atom of the
# mutant's input -- so ref C1 is a ring carbon while mut C1 is the terminal
# propyl carbon. The two ligands share 19 names that do NOT correspond
# chemically, which is precisely the case element_swap cannot detect and mcs
# exists to handle: it derives the correspondence from structure.

[system]
name        = 3htb
description = T4 lysozyme L99A/M102Q (PDB 3HTB), 2-ethylphenol -> 2-propylphenol

[ligand]
dir     = inputs
ref     = ref
mut     = mut
resname = UNL

[protein]
pdb            = inputs/protein.pdb
chain          = A
segment_prefix = P
first          = NTER
last           = CTER

[mutation]
strategy      = mcs
placement     = local_frame
missing_terms = synth_from_geometry

[hybrid]
title       = 3HTB T4L L99A/M102Q 2-ethylphenol -> 2-propylphenol
type_prefix = L
rtf_order   = sorted
prm_order   = source_then_new

[build]
padding    = 15.0
neutralize = yes
salt       = 0.0
pdbalias   = atom ILE CD1 CD
             atom SER HG HG1
             residue HIS HSD

[topology]
prot_rtf = {root}/../../toppar/top_all36_prot.rtf
params   = {root}/../../toppar/par_all36m_prot.prm
           {root}/../../toppar/par_all36_na.prm
           {root}/../../toppar/par_all36_carb.prm
           {root}/../../toppar/par_all36_lipid.prm
           {root}/../../toppar/par_all36_cgenff.prm
           {root}/../../toppar/par_water_ions_clean.prm
           {hybrid}

[run]
legs              = complex solvent
lambdas           = 0.0 0.045 0.09 0.14546 0.22425 0.30303 0.38182 0.46061
                    0.5394 0.61819 0.697 0.77576 0.85455 0.91 0.955 1.0
steps_per_window  = 500000
equil_steps       = 50000
alch_equil_steps  = 50000
outfreq           = 500
min_steps         = 5000
timestep          = 2.0
temperature       = 300.0
cutoff            = 12.0
switchdist        = 10.0
pairlistdist      = 14.0
elec_lambda_start = 0.5
vdw_lambda_end    = 1.0
vdw_shift_coeff   = 5.0
decouple          = off
max_hours         = 40.0

[binaries]
namd         = ${NAMD:-/home/aistudio/NAMD_3.0.3_Source/Linux-x86_64-g++.gpuresident/namd3}
vmd          = ${VMD:-/home/aistudio/vmd-env/bin/vmd}
flags        = +p1 +devices 0
gpu_resident = on
